<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>우리반 전용 번호 뽑기</title>

  <link rel="icon" type="image/png" href="logo.png" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="container">

    <h1>우리반 전용 번호 뽑기</h1>

    <p class="description" id="description">
      1번부터 25번까지 중 랜덤 번호를 뽑습니다.
      19번은 제외됩니다.
    </p>

    <div class="mode-selector">
      <button class="mode-btn active" data-mode="basic">기본</button>
      <button class="mode-btn" data-mode="teacher">선생님</button>
      <button class="mode-btn" data-mode="teacher-mystery">선생님(?)</button>
      <button class="mode-btn" data-mode="mystery">???</button>
      <button class="mode-btn" data-mode="pinball">핀볼</button>
    </div>

    <div class="card">

      <div class="draw-settings" id="drawSettings">

        <label for="drawCount">
          한 번에 뽑을 인원 수
        </label>

        <select id="drawCount"></select>

      </div>

      <div
        class="number-display placeholder"
        id="numberDisplay"
      >
        뽑기 버튼을 눌러주세요
      </div>

      <div
        class="number-grid"
        id="numberGrid"
      ></div>

      <button id="drawButton">
        번호 뽑기
      </button>

      <button
        id="resetButton"
        class="secondary"
      >
        다시 시작
      </button>

    </div>

    <div class="history-card">

      <h2>뽑은 번호</h2>

      <div
        id="pickedNumbers"
        class="picked-numbers"
      >
        아직 뽑은 번호가 없습니다.
      </div>

    </div>

  </main>

  <div
    class="big-overlay"
    id="bigOverlay"
  >

    <div
      class="big-number"
      id="bigNumber"
    ></div>

  </div>

  <div class="pinball-overlay" id="pinballOverlay">
    <canvas id="pinballCanvas"></canvas>
  </div>

<script src="main.js"></script>

</body>
</html>
