<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>우리반 전용 번호 뽑기</title>

  <link rel="icon" type="image/png" href="logo.png" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="container">

    <h1>우리반 전용 번호 뽑기</h1>

    <p class="description" id="description">
      1번부터 25번까지 중 랜덤 번호를 뽑습니다.
      19번은 제외됩니다.
    </p>

    <div class="mode-selector">
      <button class="mode-btn active" data-mode="basic">기본</button>
      <button class="mode-btn" data-mode="teacher">선생님</button>
      <button class="mode-btn" data-mode="teacher-mystery">선생님(?)</button>
      <button class="mode-btn" data-mode="mystery">???</button>
      <button class="mode-btn" data-mode="pinball">핀볼</button>
      <button class="mode-btn" data-mode="pinball-teacher">핀볼(선생님)</button>
    </div>

    <div class="card">

      <div class="draw-settings" id="drawSettings">

        <label for="drawCount">
          한 번에 뽑을 인원 수
        </label>

        <select id="drawCount"></select>

      </div>

      <div
        class="number-display placeholder"
        id="numberDisplay"
      >
        뽑기 버튼을 눌러주세요
      </div>

      <div
        class="number-grid"
        id="numberGrid"
      ></div>

      <button id="drawButton">
        번호 뽑기
      </button>

      <button
        id="resetButton"
        class="secondary"
      >
        다시 시작
      </button>

    </div>

    <div class="history-card">

      <h2>뽑은 번호</h2>

      <div
        id="pickedNumbers"
        class="picked-numbers"
      >
        아직 뽑은 번호가 없습니다.
      </div>

    </div>

  </main>

  <div
    class="big-overlay"
    id="bigOverlay"
  >

    <div
      class="big-number"
      id="bigNumber"
    ></div>

  </div>

  <div class="pinball-overlay" id="pinballOverlay">
    <canvas id="pinballCanvas"></canvas>
  </div>

  <div class="admin-overlay" id="adminOverlay" aria-hidden="true">
    <section class="admin-panel" role="dialog" aria-modal="true">
      <button class="admin-close" id="adminCloseButton" aria-label="관리자 모드 닫기">
        ×
      </button>

      <div id="adminLoginView">
        <h2>관리자 모드</h2>
        <form id="adminLoginForm" class="admin-login-form">
          <label for="adminPassword">비밀번호</label>
          <input
            id="adminPassword"
            type="password"
            autocomplete="current-password"
          />
          <p class="admin-error" id="adminError"></p>
          <button type="submit">입장</button>
        </form>
      </div>

      <div id="adminManageView" hidden>
        <h2>관리자 모드</h2>

        <label class="admin-mode-label" for="adminModeSelect">
          수정할 모드
        </label>
        <select id="adminModeSelect"></select>

        <div class="admin-list" id="adminList"></div>

        <form id="adminAddForm" class="admin-add-form">
          <input
            id="adminNewItem"
            type="text"
            maxlength="20"
            placeholder="추가할 번호 또는 이름"
          />
          <button type="submit">추가</button>
        </form>

        <p class="admin-error" id="adminManageError"></p>
        <button class="secondary" id="adminResetButton" type="button">
          기본값으로 되돌리기
        </button>
      </div>
    </section>
  </div>

<script type="module" src="main.js"></script>

</body>
</html>
