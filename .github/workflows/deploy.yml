name: Deploy to GitHub Pages (official)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "Missing GitHub secret: YOUTUBE_API_KEY" >&2
            exit 1
          fi
          mkdir dist
          rsync -a --exclude='.git' --exclude='dist' ./ dist/
          node - <<'NODE'
          const fs = require('fs');
          const path = 'dist/song.js';
          const key = process.env.YOUTUBE_API_KEY;
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(
            "const YOUTUBE_API_KEY = '__YOUTUBE_API_KEY__';",
            `const YOUTUBE_API_KEY = ${JSON.stringify(key)};`
          );
          fs.writeFileSync(path, source);
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
